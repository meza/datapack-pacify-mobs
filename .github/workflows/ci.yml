# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:

permissions:
  issues: write
  checks: write
  contents: write
  pull-requests: write

env:
  TYPE: ${{ endsWith(github.ref_name, 'beta') && 'beta' || 'release' }}
  # renovate: datasource=npm depName=semantic-release
  SEMANTIC_RELEASE_VERSION: "25.0.9"
  # renovate: datasource=npm depName=conventional-changelog-conventionalcommits
  CONVENTIONAL_CHANGELOG_CONVENTIONALCOMMITS_VERSION: "9.3.1"
  # renovate: datasource=npm depName=@semantic-release/github
  SEMANTIC_RELEASE_GITHUB_VERSION: "12.0.9"
  # renovate: datasource=npm depName=@semantic-release/changelog
  SEMANTIC_RELEASE_CHANGELOG_VERSION: "7.0.0"
  # renovate: datasource=npm depName=@semantic-release/exec
  SEMANTIC_RELEASE_EXEC_VERSION: "7.1.0"
  # renovate: datasource=npm depName=semantic-release-export-data
  SEMANTIC_RELEASE_EXPORT_DATA_VERSION: "1.2.0"
  # renovate: datasource=npm depName=semantic-release-discord-notifier
  SEMANTIC_RELEASE_DISCORD_NOTIFIER_VERSION: "1.1.3"

jobs:
  build:
    runs-on: meza-ubuntu-slim
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔃 Use Latest Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: "🧵 Install semantic release"
        run: >-
          npm i --location=global
          "semantic-release@$SEMANTIC_RELEASE_VERSION"
          "conventional-changelog-conventionalcommits@$CONVENTIONAL_CHANGELOG_CONVENTIONALCOMMITS_VERSION"
          "@semantic-release/github@$SEMANTIC_RELEASE_GITHUB_VERSION"
          "@semantic-release/changelog@$SEMANTIC_RELEASE_CHANGELOG_VERSION"
          "@semantic-release/exec@$SEMANTIC_RELEASE_EXEC_VERSION"
          "semantic-release-export-data@$SEMANTIC_RELEASE_EXPORT_DATA_VERSION"
          "semantic-release-discord-notifier@$SEMANTIC_RELEASE_DISCORD_NOTIFIER_VERSION"

      - name: "🔢 Determine version"
        run: npx semantic-release --dry-run
        id: get-next-version
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: "ℹ️ Needs Release?"
        run: echo "Needs release published? ${{ steps.get-next-version.outputs.new-release-published == 'true' }}"

      - name: "Package and Publish"
        if: ${{ steps.get-next-version.outputs.new-release-published == 'true'  }}
        run: cd src && zip -r ../Pacify-Mobs-${{ steps.get-next-version.outputs.new-release-version }}.zip *

      - name: "🏗️ Build & Release to GitHub"
        if: ${{ steps.get-next-version.outputs.new-release-published == 'true'  }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: npx semantic-release

      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        name: "🚀 Publish on modrinth"
        if: ${{ steps.get-next-version.outputs.new-release-published == 'true' }}
        with:
          version-type: ${{ env.TYPE }}
          name: Pacify Mobs v${{ steps.get-next-version.outputs.new-release-version }}
          version: ${{ steps.get-next-version.outputs.new-release-version }}
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          changelog-file: CHANGELOG.*
          files: Pacify-Mobs-${{ steps.get-next-version.outputs.new-release-version }}.zip
          loaders: |
            datapack
          game-versions: |
            26.3
          game-version-filter: releases
